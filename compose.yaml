services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["uvicorn", "ocr_service.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ocr-tmp:/tmp/ocr
      - object-store:/tmp/ocr-objects:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "ocr_service.workers.runner"]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ocr-tmp:/tmp/ocr
      - object-store:/tmp/ocr-objects:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  redis-data:
  ocr-tmp:
  object-store:

